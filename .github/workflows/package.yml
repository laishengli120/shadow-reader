name: Package desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/windows-word-guide-20260809"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify application
        run: python -m unittest discover -s tests -v
      - name: Build desktop package
        run: python build.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: shadow-reader-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
